[program:chabok-outbox]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan chabok:outbox:work --limit=50 --worker-id=%(host_node_name)s-%(process_num)02d
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopwaitsecs=30
